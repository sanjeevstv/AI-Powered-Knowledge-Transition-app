[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "kt-api"
version = "0.1.0"
description = "FastAPI backend for AI-Powered KT Automation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlmodel>=0.0.22",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "openai>=1.55.0",
  "chromadb>=0.5.0",
  "pypdf>=5.0.0",
  "bcrypt>=4.0.0",
  "pyjwt[crypto]>=2.9.0",
  "email-validator>=2.2.0",
  "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
